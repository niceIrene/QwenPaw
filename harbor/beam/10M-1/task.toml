schema_version = "1.3"
source = "https://huggingface.co/datasets/Mohammadta/BEAM-10M"

[task]
name = "beam/10M-1"
description = "BEAM long-term-memory probing over a 10M multi-session conversation."
keywords = ["long-term-memory", "multi-session", "beam", "qwenpaw"]

[metadata]
runner = "qwenpaw-beam"
benchmark = "beam"
scale = "10M"
conversation_id = 1
n_sessions = 100
n_probes = 20
judge_variant = "beam-official-compatible-v1"
official_beam_commit = "3e12035532eb85768f1a7cd779832b650c4b2ef9"

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 1800.0
env = { BEAM_JUDGE_API_KEY = "${BEAM_JUDGE_API_KEY}", BEAM_JUDGE_BASE_URL = "${BEAM_JUDGE_BASE_URL}", BEAM_JUDGE_MODEL = "${BEAM_JUDGE_MODEL}" }

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
env = { BEAM_CONVERSATION_ID = "1" }
