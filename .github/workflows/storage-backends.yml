name: Storage backend validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/storage-backends.yml'
  push:
    branches: [feat/pg-runtime-review-7954]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/storage-backends.yml'

permissions:
  contents: read

jobs:
  postgres-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qwenpaw
          POSTGRES_PASSWORD: storage-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qwenpaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QWENPAW_TEST_POSTGRES_DSN: postgresql://qwenpaw:storage-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-cov
      - name: Exercise both backends and offline recovery
        env:
          QWENPAW_WORKING_DIR: ${{ runner.temp }}/qwenpaw-storage
        run: >-
          python -m pytest -q tests/unit/storage tests/unit/app/chats
          tests/unit/app/crons tests/unit/token_usage tests/unit/backup
          tests/unit/agents/hooks/test_session_hook.py

  sqlite-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -e . pytest pytest-asyncio pytest-cov
      - name: Verify default local storage and session compatibility
        env:
          QWENPAW_WORKING_DIR: ${{ runner.temp }}/qwenpaw-storage
        run: >-
          python -m pytest -q tests/unit/app/chats tests/unit/token_usage
          tests/unit/storage/test_storage_config.py
          tests/unit/storage/test_database_session.py
          tests/unit/storage/test_storage_sessions.py
          tests/unit/agents/hooks/test_session_hook.py
          -k "not postgresql"

  postgres-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and tests
        run: python -m pip install -e . pytest pytest-asyncio pytest-cov
      - name: Start isolated PostgreSQL
        shell: pwsh
        run: |
          $pgBin = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 |
            ForEach-Object { Split-Path $_.FullName }
          if (-not $pgBin) { throw 'PostgreSQL binaries are required for this job' }
          "$pgBin" | Out-File -FilePath $env:GITHUB_PATH -Append
          $dataDir = Join-Path $env:RUNNER_TEMP 'storage-pg'
          & "$pgBin\initdb.exe" -D $dataDir -U qwenpaw -A trust -E UTF8
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & "$pgBin\pg_ctl.exe" -D $dataDir -l "$dataDir.log" -o '-p 55439 -h 127.0.0.1' -w start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL startup failed' }
      - name: Verify PostgreSQL recovery and recall file lifecycle
        env:
          QWENPAW_WORKING_DIR: ${{ runner.temp }}/qwenpaw-storage
          QWENPAW_TEST_POSTGRES_DSN: postgresql://qwenpaw@127.0.0.1:55439/postgres
        run: >-
          python -m pytest -q
          tests/unit/storage/test_offline_recovery_drill.py
          tests/unit/storage/test_async_scroll_persistence.py
          tests/unit/storage/test_workspace_import.py
          tests/unit/storage/test_storage_migration.py
          tests/unit/storage/test_storage_business_backup.py
          tests/unit/storage/test_recall_snapshot.py
          tests/unit/storage/test_database_scroll_runtime.py
      - name: Stop PostgreSQL
        if: always()
        shell: pwsh
        run: |
          if (Get-Command pg_ctl -ErrorAction SilentlyContinue) {
            pg_ctl -D "$env:RUNNER_TEMP/storage-pg" -m fast -w stop
          }
